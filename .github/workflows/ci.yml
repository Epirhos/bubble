# Garde-fou bon marché : tout ce qui peut être vérifié sur Linux l'est ICI, avant de payer
# une minute macOS (facturée 10x). Le job iOS (.github/workflows/ios.yml) attend ce workflow.
name: CI

# Un commit de documentation seul ne declenche rien : aucune minute payee pour un .md.
# (Ne pas transformer CI en status check obligatoire tant que ce filtre existe : un run
# "skipped" bloquerait la fusion d'une PR purement documentaire.)
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.pdf"
      - "brain/**"
      - ".gitignore"
      - ".gitattributes"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.pdf"
      - "brain/**"
      - ".gitignore"
      - ".gitattributes"
  workflow_dispatch:

# Un push qui en remplace un autre annule le run précédent : zéro minute gaspillée.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Moteur KMP + app Android. Couvre commonMain/commonTest (donc aussi le code iOS partagé,
  # à l'exception des adaptateurs natifs) : la majorité des régressions tombent ici.
  gradle:
    name: Moteur + Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Cache Gradle + validation du checksum du wrapper (inclus dans l'action).
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # Le bit exécutable est versionné (100755) mais un checkout Windows peut le perdre.
      - name: Rendre gradlew exécutable
        run: chmod +x gradlew

      # Étape la plus rapide en premier : si le moteur est cassé, on ne compile pas l'APK.
      - name: Tests du moteur (commonTest via JVM)
        run: ./gradlew :shared:jvmTest --stacktrace

      - name: APK debug
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      # L'APK debug pèse ~125 Mo (libs natives WebRTC + MediaPipe, toutes ABI). Le stocker à
      # chaque PR remplirait le quota de stockage d'artefacts : on ne le publie que sur main.
      # Les .task MediaPipe sont hors git : cet APK valide la compilation, il n'est pas
      # installable tel quel (cf. ./scripts/fetch-models.sh).
      - name: Publier l'APK
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: bubble-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          # Un APK est déjà un zip : le recompresser coûte du temps pour ~0 octet gagné.
          compression-level: 0
          retention-days: 7

      # Rapports HTML des tests : évite un second run pour comprendre un échec.
      - name: Publier les rapports de test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: shared/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  # Relai de signalisation : le smoke test lance le serveur, apparie 2 pairs et vérifie
  # le refus strict d'un 3e. Exit 0 = OK (voir server/smoke-test.js).
  signaling:
    name: Serveur de signalisation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Installer
        working-directory: server
        run: npm ci

      - name: Smoke test
        working-directory: server
        run: npm run smoke
