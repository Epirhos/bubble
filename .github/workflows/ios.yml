# Compile la face iOS sur un runner macOS cloud — pas de Mac local requis.
# Valide le cinterop WebRTC (IosPeerLink), le Keychain, et les vues SwiftUI branchées SKIE.
# Voir /brain/IOS_BUILD.md
name: iOS

on:
  push:
    branches: [main]
    paths:
      - "shared/**"
      - "iosApp/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # gradlew a été créé sous Windows (sans bit exécutable) → l'ajouter sur le runner macOS.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Cache Gradle + Kotlin/Native (LLVM ~1 Go) → économise ~1-2 min par run suivant.
      - name: Cache Gradle & Konan
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ runner.os }}-kmp-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-kmp-

      # WebRTC.xcframework (stasel) : récupère l'asset de la dernière release via l'API GitHub
      # (robuste au nommage exact du zip), puis extrait dans iosApp/Vendor/.
      - name: Fetch WebRTC.xcframework
        run: |
          set -euo pipefail
          ASSET_URL=$(curl -fsSL https://api.github.com/repos/stasel/WebRTC/releases/latest \
            | grep browser_download_url | grep -i 'xcframework.zip' | head -1 | cut -d '"' -f4)
          echo "WebRTC asset: $ASSET_URL"
          curl -fL -o webrtc.zip "$ASSET_URL"
          mkdir -p iosApp/Vendor
          unzip -q webrtc.zip -d iosApp/Vendor
          echo "=== Arborescence Vendor ==="
          find iosApp/Vendor -maxdepth 3 -type d

      # Localise les slices device/simulateur dynamiquement (les noms de dossiers varient).
      - name: Locate WebRTC slices
        id: webrtc
        run: |
          set -euo pipefail
          XCF="$PWD/iosApp/Vendor/WebRTC.xcframework"
          SIM_DIR=$(dirname "$(find "$XCF" -type d -name WebRTC.framework -path '*simulator*' | head -1)")
          DEV_DIR=$(dirname "$(find "$XCF" -type d -name WebRTC.framework | grep -E '/ios-arm64/WebRTC.framework$' | head -1)")
          echo "sim_dir=$SIM_DIR" >> "$GITHUB_OUTPUT"
          echo "dev_dir=$DEV_DIR" >> "$GITHUB_OUTPUT"
          echo "Simulateur: $SIM_DIR"
          echo "Device:     $DEV_DIR"
          test -d "$SIM_DIR/WebRTC.framework"
          test -d "$DEV_DIR/WebRTC.framework"

      - name: Compile shared for iOS simulator (valide le cinterop WebRTC)
        run: |
          ./gradlew :shared:compileKotlinIosSimulatorArm64 \
            -Pwebrtc.framework.dir.iosSimulatorArm64="${{ steps.webrtc.outputs.sim_dir }}"

      - name: Assemble Shared.xcframework (SKIE inclus)
        run: |
          ./gradlew :shared:assembleSharedXCFramework \
            -Pwebrtc.framework.dir.iosArm64="${{ steps.webrtc.outputs.dev_dir }}" \
            -Pwebrtc.framework.dir.iosSimulatorArm64="${{ steps.webrtc.outputs.sim_dir }}"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Build iOS app (simulateur)
        working-directory: iosApp
        run: |
          xcodebuild build \
            -project Bubble.xcodeproj \
            -scheme Bubble \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGNING_ALLOWED=NO | xcpretty || true
