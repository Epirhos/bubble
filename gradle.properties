# Kotlin/Native (link du XCFramework) + SKIE sont gourmands : 2 Go suffisaient pour Android
# mais font tomber le runner macOS en OutOfMemory. 4 Go est un plafond, pas une réservation.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
kotlin.daemon.jvmargs=-Xmx3g
kotlin.code.style=official
android.useAndroidX=true
# Les cibles iOS sont declarees mais ne compilent que sur macOS (hote croise ignore).
kotlin.native.ignoreDisabledTargets=true
# cinterop WebRTC partagé entre iosArm64 et iosSimulatorArm64 (source set iosMain commun).
kotlin.mpp.enableCInteropCommonization=true
